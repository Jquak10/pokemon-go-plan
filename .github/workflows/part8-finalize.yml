name: Part 8 final validation

on:
  push:
    branches:
      - feat/part-8-ux-regression

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/part-8-ux-regression
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final hardening
        run: python3 scripts/part8-finalize.py

      - name: Check inline JavaScript
        run: |
          node --check tests/battle-plan-ui.test.mjs
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/manage.html','utf8');
          for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) {
            new vm.Script(match[1]);
          }
          NODE

      - name: Run deterministic suite
        run: npm test

      - name: Check diff
        run: git diff --check

      - name: Commit validated final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/manage.html public/styles.css tests/battle-plan-ui.test.mjs
          if git diff --cached --quiet; then
            echo "No final changes to commit."
            exit 0
          fi
          git commit -m "fix: harden Part 8 mobile and tab UX"
          git push origin HEAD:feat/part-8-ux-regression
