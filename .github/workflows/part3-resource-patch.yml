            border-radius: 12px;
            background: rgba(127, 127, 127, 0.07);
          }

          .battle-resource-advice span {
            line-height: 1.4;
            opacity: 0.8;
          }

          .battle-resource-editor {
            margin-top: 10px;
          }

          .battle-resource-editor > summary {
