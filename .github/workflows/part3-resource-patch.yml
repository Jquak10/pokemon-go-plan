            cursor: pointer;
            font-weight: 750;
          }

          .battle-resource-editor-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            padding-top: 8px;
          }

          .battle-resource-editor-grid label {
            display: grid;
            gap: 6px;
          }

          .battle-resource-editor-grid input,
          .battle-resource-save-row button {
            min-height: 44px;
          }

          .battle-resource-help {
            margin-top: 10px;
          }

          .max-particle-cost-badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 800;
            background: rgba(127, 127, 127, 0.08);
          }

          .max-particle-cost-badge.cost-unknown {
            opacity: 0.68;
          }

          @media (max-width: 900px) {
            .battle-resource-grid {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }

          @media (max-width: 600px) {
            .battle-resource-panel-head {
              align-items: center;
            }

            .battle-resource-grid,
            .battle-resource-editor-grid {
              grid-template-columns: 1fr;
            }

            .battle-resource-grid article {
              padding: 10px 11px;
            }
          }
          ''')

          # Every public page sharing styles.css must move to v32.
          for page in Path("public").glob("*.html"):
              text = page.read_text()
              if "styles.css?v=31" in text:
                  page.write_text(
                      text.replace(
                          "styles.css?v=31",
                          "styles.css?v=32"
                      )
                  )

          # Integrated UI regression expectations.
          test_text = read(ui_test)
          test_text = test_text.replace(
              "Battle Plan / Max Battle UI — v31",
              "Battle Plan / Max Battle UI — v31"
          )
          test_text = test_text.replace(
              r"styles\.css\?v=31",
              r"styles\.css\?v=32"
          )
          test_text += r'''

          assert.match(manage, /BATTLE RESOURCES/);
          assert.match(manage, /Remote Passes & Max Particles/);
          assert.match(manage, /maxParticlesHeld/);
          assert.match(manage, /maxParticlesCollectedToday/);
          assert.match(manage, /remoteMaxPassesUsed/);
          assert.match(manage, /saveBattleResources/);
          assert.match(manage, /\/api\/battle-resources/);
          assert.match(manage, /MP cost unknown/);
          assert.match(manage, /Remote Max battle/);
          assert.match(styles, /Battle resource planning — v32/);
          assert.match(worker, /battle_resource_plan/);
          assert.match(worker, /battleResourcePlanForUser/);
          assert.match(worker, /updateBattleResourcesApi/);
          assert.match(worker, /max_particle_cost/);
