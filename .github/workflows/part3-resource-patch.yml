          .battle-resource-panel-head h3 {
            margin: 3px 0 0;
          }

          .battle-resource-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
          }

          .battle-resource-grid article {
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(127, 127, 127, 0.06);
          }

          .battle-resource-grid span,
          .battle-resource-grid small {
            display: block;
          }

          .battle-resource-grid span {
            font-size: 0.78rem;
            font-weight: 700;
            opacity: 0.74;
          }

          .battle-resource-grid strong {
            display: block;
            margin: 4px 0;
            font-size: 1.08rem;
          }

          .battle-resource-grid small {
            line-height: 1.35;
