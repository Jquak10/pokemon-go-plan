name: Remote limit timezone integration

on:
  push:
    branches:
      - fix/remote-limit-timezones

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-limit-timezones
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded fix
        run: |
          python3 scripts/fix-remote-limit-timezones.py
          python3 scripts/fix-remote-limit-parser-regex.py
      - name: Check syntax
        run: |
          node --check src/remote-raid-rules.js
          node --check src/index.js
      - name: Run deterministic suite
        run: npm test
      - name: Check diff
        run: git diff --check
      - name: Commit validated fix
        run: |
          if git diff --quiet; then
            echo "No product diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js src/remote-raid-rules.js tests/remote-raid-rules.test.mjs package.json
          git commit -m "fix: respect timezone windows for Remote limits"
          git push origin HEAD:fix/remote-limit-timezones
