name: Fix Shadow raid-rank fallback

on:
  push:
    branches:
      - feat/raid-attacker-rankings
    paths:
      - .github/workflows/fix-shadow-rank-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/raid-attacker-rankings
          fetch-depth: 0

      - name: Apply Shadow fallback fix
        run: python .github/scripts/fix_shadow_rank_fallback.py

      - name: Validate
        run: |
          node --check src/index.js
          node --check src/raid-rankings.js
          grep -q 'normalized.startsWith("shadow ")' src/index.js
          git diff --check
          ! git diff --name-only | grep -Eq '^(wrangler\.jsonc|schema\.sql|public/styles\.css)$'

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git add -u .github/scripts/fix_shadow_rank_fallback.py .github/workflows/fix-shadow-rank-fallback.yml
          git commit -m "fix: keep Shadow raid ranks form-specific"
          git push origin HEAD:feat/raid-attacker-rankings
