name: Validate Crowned raid rankings

on:
  push:
    branches:
      - fix/crowned-raid-rankings
    paths:
      - src/raid-rankings.js
      - .github/workflows/validate-crowned-rankings.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check src/raid-rankings.js

      - name: Validate current Crowned forms against live Pokémon GO API data
        run: |
          node --input-type=module <<'NODE'
          import {
            RAID_RANK_METHOD_VERSION,
            buildRaidAttackerRankCatalog,
            raidRankProfileForName
          } from './src/raid-rankings.js';

          const response = await fetch('https://pokemon-go-api.github.io/pokemon-go-api/api/pokedex.json');
          if (!response.ok) throw new Error(`Pokémon GO API returned ${response.status}`);
          const pokedex = await response.json();
          const catalog = buildRaidAttackerRankCatalog(pokedex);

          const check = (requested, crownedName, moveName, expectedSteelRank) => {
            const profile = raidRankProfileForName(requested, catalog);
            if (!profile) throw new Error(`No profile for ${requested}`);
            console.log(requested, JSON.stringify(profile, null, 2));

            const genericName = requested.split(' (')[0];
            if (profile.variants.some((variant) => variant.name === genericName)) {
              throw new Error(`${requested} still exposes misleading generic ${genericName} variant`);
            }

            const crowned = profile.variants.find((variant) => variant.name === crownedName);
            if (!crowned) throw new Error(`${crownedName} comparison variant missing`);

            const steel = crowned.rankings.find((ranking) => ranking.type === 'Steel');
            if (!steel) throw new Error(`${crownedName} Steel ranking missing`);
            if (steel.charged_move !== moveName) {
              throw new Error(`${crownedName} uses ${steel.charged_move}; expected ${moveName}`);
            }
            if (steel.rank !== expectedSteelRank) {
              throw new Error(`${crownedName} Steel rank is #${steel.rank}; expected #${expectedSteelRank}`);
            }
          };

          check(
            'Zamazenta (Hero of Many Battles)',
            'Zamazenta (Crowned Shield)',
            'Behemoth Bash',
            2
          );
          check(
            'Zacian (Hero of Many Battles)',
            'Zacian (Crowned Sword)',
            'Behemoth Blade',
            1
          );

          if (!RAID_RANK_METHOD_VERSION.includes('v2')) {
            throw new Error('Raid rank method version was not bumped');
          }
          NODE

      - name: Validate branch diff
        run: |
          git diff --check origin/main...HEAD
