name: Apply Battle Plan UI integration

on:
  push:
    branches:
      - feat/max-battle-plan-ui
    paths:
      - .github/workflows/part2-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/max-battle-plan-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused Part 2 changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          # ---------------- backend recommendation metadata ----------------
          p = Path('src/index.js')
          text = p.read_text()

          import_anchor = '''import {
            RAID_RANK_METHOD_VERSION,
            buildRaidAttackerRankCatalog,
            raidRankProfileForName
          } from "./raid-rankings.js";
          '''
          import_new = import_anchor + '''import {
            BATTLE_SOURCE_TYPES,
            battleOpportunityMetadata,
            battleOpportunityPresentation,
            maxBattleVariantFromText
          } from "./battle-opportunities.js";
          '''
          text = replace_once(text, import_anchor, import_new, 'index imports')

          old_sources = '''const RAID_SOURCE_TYPES = new Set([
            "raid_battles",
            "raid_day",
            "raid_hour",
            "max_battles",
            "max_mondays"
          ]);
          '''
          text = replace_once(
              text,
              old_sources,
              '''// Battle recommendations include standard Raids plus Max Battles.
          // Keep the legacy constant name here so the existing meta/calendar plumbing
          // remains stable while the UI migrates to the shared battle model.
          const RAID_SOURCE_TYPES = BATTLE_SOURCE_TYPES;
          ''',
              'battle source alias'
          )

          old_loop = '''    for (const match of matches) {
                const key = normalizeName(match.name);

                const rec =
                  recommendationFor(
                    match.name,
                    match.meta,
                    match.target,
                    user
                  );

                const existing = map.get(key);
                const remoteEligible =
                  REMOTE_RAID_SOURCE_TYPES.has(
                    event.source_type
                  );
          '''
          new_loop = '''    for (const match of matches) {
                const rec =
                  recommendationFor(
                    match.name,
                    match.meta,
                    match.target,
                    user
                  );

                // Part 2 keeps the existing Raid allocator unchanged. Max Battles are
                // exposed to the Battle Plan UI now, but shared Remote Pass allocation
                // is intentionally deferred to the resource-planning part.
                const remoteEligible =
                  REMOTE_RAID_SOURCE_TYPES.has(
                    event.source_type
                  );

                const battleMetadata =
                  battleOpportunityMetadata(
                    event,
                    {
                      pokemonName: match.name,
                      remoteEligible
                    }
                  );

                const battlePresentation =
                  battleOpportunityPresentation(
                    battleMetadata
                  );

                const key = [
                  battleMetadata?.battle_system || "raid",
                  battleMetadata?.battle_variant || "",
                  normalizeName(match.name)
                ].join("|");

                const existing = map.get(key);
          '''
          text = replace_once(text, old_loop, new_loop, 'recommendation loop')

          old_occurrence = '''      const occurrence = {
                  ...rec,
                  event_title: event.summary,
          '''
          new_occurrence = '''      const occurrence = {
                  ...rec,
                  ...battleMetadata,
                  battle_presentation:
                    battlePresentation,
                  sprite_exact_form:
                    battleMetadata?.battle_variant === "gigantamax"
                      ? maxBattleVariantFromText(match.name) === "gigantamax"
                      : true,
                  event_title: event.summary,
          '''
          text = replace_once(text, old_occurrence, new_occurrence, 'occurrence metadata')
          p.write_text(text)

          # ---------------- visible Battle Plan UI ----------------
          p = Path('public/manage.html')
          text = p.read_text()

          replacements = [
              ('<title>My Pokémon GO Raid Planner</title>', '<title>My Pokémon GO Battle Planner</title>', 'title'),
              ('PERSONAL RAID STRATEGY', 'PERSONAL BATTLE STRATEGY', 'kicker'),
              ('<h1>Pokémon GO Raid Planner</h1>', '<h1>Pokémon GO Battle Planner</h1>', 'hero heading'),
              ('A live, personalized raid plan using current raid value,\n          your goals, and your Remote Raid preferences.', 'A live, personalized Battle Plan for Raids and Max Battles,\n          using current value, your goals, and your resource preferences.', 'hero copy'),
              ('<span>Raid Plan</span>', '<span class="nav-label-desktop">Battle Plan</span><span class="nav-label-mobile">Plan</span>', 'plan nav label'),
              ('<!-- =======================================================\n           TAB: RAID PLAN\n           ======================================================= -->', '<!-- =======================================================\n           TAB: BATTLE PLAN\n           ======================================================= -->', 'tab comment'),
              ('<span class="section-eyebrow">RAID RECOMMENDATIONS</span>\n                  <h2>What to raid now</h2>\n                  <p class="section-subtitle">\n                    Meta value, personal targets, battle intel, and Remote Raid allocation in one place.\n                  </p>', '<span class="section-eyebrow">BATTLE OPPORTUNITIES</span>\n                  <h2>What to battle now</h2>\n                  <p class="section-subtitle">\n                    Raids and Max Battles in one decision view. Max Battle resource allocation is added separately from the existing Raid allocator.\n                  </p>', 'recommendation heading'),
              ('<div id="recommendations" class="recommendation-grid compact-recommendation-grid"></div>', '''<div class="battle-plan-filter" role="group" aria-label="Battle type">
                <button type="button" class="battle-filter-button active" data-battle-filter="all" aria-pressed="true">
                  All <span id="battleFilterAllCount">0</span>
                </button>
                <button type="button" class="battle-filter-button" data-battle-filter="raid" aria-pressed="false">
                  Raids <span id="battleFilterRaidCount">0</span>
                </button>
                <button type="button" class="battle-filter-button" data-battle-filter="max" aria-pressed="false">
                  Max Battles <span id="battleFilterMaxCount">0</span>
                </button>
              </div>

              <div id="recommendations" class="recommendation-grid compact-recommendation-grid"></div>''', 'battle filter'),
              ('<details class="compact-details zero-raid-details">\n                <summary>Bosses receiving 0 Remote Raids</summary>', '<details id="remoteRaidZeroDetails" class="compact-details zero-raid-details">\n                <summary>Raid bosses receiving 0 Remote Raids</summary>', 'zero raid details'),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)

          # persisted filter state
          state_anchor = '''let state = null;
          let targetById = new Map();
          '''
          state_new = '''let state = null;
          let battlePlanFilter =
            ["all", "raid", "max"].includes(
              sessionStorage.getItem("battle-plan-filter")
            )
              ? sessionStorage.getItem("battle-plan-filter")
              : "all";
          let targetById = new Map();
          '''
          text = replace_once(text, state_anchor, state_new, 'filter state')

          # Make Max battle intel use the actual encounter identity when provided.
          text = replace_once(
              text,
              '''  const boss =
              catalogEntryByName(
                rec.pokemon_name
              );

            const encounter =
              raidEncounterEntry(
                rec.pokemon_name
              ) || boss;
          ''',
              '''  const boss =
              catalogEntryByName(
                rec.boss_name ||
                rec.pokemon_name
              ) ||
              catalogEntryByName(
                rec.pokemon_name
              );

            const encounter =
              catalogEntryByName(
                rec.encounter_name
              ) ||
              raidEncounterEntry(
                rec.pokemon_name
              ) || boss;
          ''',
              'battle intel identity'
          )

          # Hundo raid CP is not reused for Max Battles in this UI slice.
          text = replace_once(
              text,
              '        intel.normalCp && intel.boostedCp\n',
              '        rec.battle_system !== "max" && intel.normalCp && intel.boostedCp\n',
              'max hundo guard'
          )
          text = text.replace(
              'Raid battle form: <strong>${esc(intel.boss.name)}</strong><br>\n                  Catch encounter used for hundo CP:',
              'Battle form: <strong>${esc(intel.boss.name)}</strong><br>\n                  Encounter form:'
          )

          # Replace recommendation rendering as one bounded block.
          pattern = re.compile(r'function renderRecommendationCard\([\s\S]*?\nfunction targetProgress\(target\) \{', re.M)
          if not pattern.search(text):
              raise SystemExit('missing anchor: recommendation render block')
          replacement = r'''function recommendationSpriteUrl(rec) {
            const policy =
              rec.battle_presentation
                ?.sprite_policy || null;

            if (
              policy?.requires_exact_form &&
              !rec.sprite_exact_form
            ) {
              return null;
            }

            return (
              rec.sprite_url ||
              rec.meta?.sprite_url ||
              null
            );
          }

          function battleSystemBadgeHtml(rec) {
            const presentation =
              rec.battle_presentation || {};

            const systemLabel =
              presentation.system_label ||
              (rec.battle_system === "max"
                ? "Max Battle"
                : "Raid");

            const variantLabel =
              presentation.variant_label ||
              null;

            return `
              <span class="battle-system-badge battle-system-${esc(rec.battle_system || "raid")}">
                ${esc(systemLabel)}
              </span>
              ${
                variantLabel
                  ? `<span class="max-capability-badge max-capability-${esc(rec.battle_variant || "max")}">${esc(variantLabel)}</span>`
                  : ""
              }
            `;
          }

          function renderRecommendationCard(
            rec,
            allocation
          ) {
            const isMax =
              rec.battle_system === "max";

            const allocated =
              Number(
                allocation?.allocated || 0
              );

            const allocationClass =
              allocated > 0
                ? "has-allocation"
                : "no-allocation";

            return `
              <article class="recommendation-card compact-recommendation-card ${scoreTone(rec.score)} battle-card battle-card-${esc(rec.battle_system || "raid")}">
                <div class="recommendation-card-head">
                  <div class="recommendation-pokemon">
                    ${spriteImg(
                      recommendationSpriteUrl(rec),
                      rec.boss_name || rec.pokemon_name,
                      "pokemon-sprite recommendation-sprite"
                    )}

                    <div>
                      <div class="battle-card-kicker">
                        ${battleSystemBadgeHtml(rec)}
                      </div>
                      <span class="section-eyebrow" title="${esc(rec.source_label ? `Source: ${rec.source_label}` : "")}">${esc(rec.event_title || "ACTIVE BATTLE")}</span>
                      <h3>${esc(rec.emoji)} ${esc(rec.pokemon_name)}</h3>
                    </div>
                  </div>

                  <div class="score-ring">${formatNumber(rec.score)}</div>
                </div>

                <div class="recommendation-card-meta">
                  <span class="status-badge ${scoreTone(rec.score)}">${esc(rec.label)}</span>

                  ${
                    !isMax
                      ? `
                        <span class="allocation-inline-badge ${allocationClass}">
                          ${
                            allocated > 0
                              ? `${formatNumber(allocated)} Remote raid${allocated === 1 ? "" : "s"}`
                              : "0 Remote raids"
                          }
                        </span>
                      `
                      : ""
                  }

                  ${
                    rec.source_label &&
                    rec.source_kind === "official"
                      ? `
                        <span class="source-confidence-badge source-official">
                          ✓ ${esc(rec.source_label)}
                        </span>
                      `
                      : ""
                  }
                </div>

                ${!isMax ? raidRankingsHtml(rec.meta?.raid_rankings_json) : ""}

                ${raidIntelHtml(rec)}

                <div class="recommendation-footer-row">
                  <details class="compact-details">
                    <summary>Why?</summary>
                    <ul>
                      ${rec.reasons.map(reason => `<li>${esc(reason)}</li>`).join("")}
                    </ul>
                  </details>

                  ${
                    !isMax
                      ? `
                        <button
                          type="button"
                          class="log-raid-button"
                          data-log-raid="${esc(rec.pokemon_name)}"
                        >
                          + Log raid
                        </button>
                      `
                      : ""
                  }
                </div>
              </article>
            `;
          }

          function setBattlePlanFilter(value) {
            battlePlanFilter =
              ["all", "raid", "max"].includes(value)
                ? value
                : "all";

            sessionStorage.setItem(
              "battle-plan-filter",
              battlePlanFilter
            );

            renderRecommendations();
          }

          function renderRecommendations() {
            const container =
              document.getElementById(
                "recommendations"
              );

            const allRecommendations =
              state.recommendations || [];

            const counts = {
              all: allRecommendations.length,
              raid: allRecommendations.filter(rec => (rec.battle_system || "raid") === "raid").length,
              max: allRecommendations.filter(rec => rec.battle_system === "max").length
            };

            document.getElementById("battleFilterAllCount").textContent = formatNumber(counts.all);
            document.getElementById("battleFilterRaidCount").textContent = formatNumber(counts.raid);
            document.getElementById("battleFilterMaxCount").textContent = formatNumber(counts.max);

            document
              .querySelectorAll("[data-battle-filter]")
              .forEach(button => {
                const active =
                  button.dataset.battleFilter ===
                  battlePlanFilter;
                button.classList.toggle("active", active);
                button.setAttribute("aria-pressed", active ? "true" : "false");
              });

            const recommendations =
              allRecommendations.filter(rec =>
                battlePlanFilter === "all" ||
                (rec.battle_system || "raid") === battlePlanFilter
              );

            document
              .getElementById("remoteRaidZeroDetails")
              ?.classList.toggle(
                "hidden",
                battlePlanFilter === "max"
              );

            const allocations =
              state.remote_raid_plan
                ?.allocations || [];

            const allocationByName =
              new Map(
                allocations.map(
                  allocation => [
                    normalizePickerName(
                      allocation.pokemon_name
                    ),
                    allocation
                  ]
                )
              );

            if (!recommendations.length) {
              const emptyLabel =
                battlePlanFilter === "max"
                  ? "Max Battle"
                  : battlePlanFilter === "raid"
                    ? "Raid"
                    : "battle";

              container.innerHTML = `
                <div class="empty-state">
                  <span aria-hidden="true">⌕</span>
                  <strong>No matching active ${esc(emptyLabel)} opportunities yet.</strong>
                  <p>Current opportunities appear after event data and automatic assessments are available.</p>
                </div>
              `;
              return;
            }

            const primary =
              recommendations.slice(
                0,
                4
              );

            const additional =
              recommendations.slice(
                4
              );

            const renderCard =
              rec =>
                renderRecommendationCard(
                  rec,
                  rec.battle_system === "max"
                    ? null
                    : allocationByName.get(
                        normalizePickerName(
                          rec.pokemon_name
                        )
                      )
                );

            container.innerHTML = `
              ${primary
                .map(renderCard)
                .join("")}

              ${
                additional.length
                  ? `
                    <details class="more-recommendations">
                      <summary>
                        <span>
                          More battle opportunities
                          <strong>${formatNumber(additional.length)}</strong>
                        </span>
                        <span class="details-chevron" aria-hidden="true">⌄</span>
                      </summary>

                      <div class="recommendation-grid more-recommendation-grid">
                        ${additional
                          .map(renderCard)
                          .join("")}
                      </div>
                    </details>
                  `
                  : ""
              }
            `;
          }

          function targetProgress(target) {'''
          text = pattern.sub(replacement, text, count=1)

          # Add filter delegation to existing document click handler.
          click_anchor = '''document.addEventListener(
            "click",
            event => {
              const logButton =
          '''
          click_new = '''document.addEventListener(
            "click",
            event => {
              const battleFilterButton =
                event.target.closest(
                  "[data-battle-filter]"
                );

              if (battleFilterButton) {
                setBattlePlanFilter(
                  battleFilterButton.dataset.battleFilter
                );
                return;
              }

              const logButton =
          '''
          text = replace_once(text, click_anchor, click_new, 'battle filter listener')

          p.write_text(text)

          # ---------------- responsive styles ----------------
          p = Path('public/styles.css')
          css = p.read_text()
          marker = '/* Battle Plan / Max Battle UI — v31 */'
          if marker in css:
              raise SystemExit('Battle Plan styles already present')
          css += r'''

          /* Battle Plan / Max Battle UI — v31 */
          .nav-label-mobile {
            display: none;
          }

          .battle-plan-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 16px;
          }

          .battle-filter-button {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 999px;
            white-space: nowrap;
          }

          .battle-filter-button span {
            min-width: 1.6em;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(127, 127, 127, 0.14);
            font-size: 0.78em;
            line-height: 1.2;
          }

          .battle-filter-button.active {
            border-color: currentColor;
          }

          .battle-card-kicker {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
          }

          .battle-system-badge,
          .max-capability-badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
          }

          .battle-system-max {
            border-style: dashed;
          }

          .max-capability-badge {
            background: rgba(127, 127, 127, 0.1);
          }

          .battle-card-max .recommendation-card-head {
            align-items: flex-start;
          }

          @media (max-width: 700px) {
            .nav-label-desktop {
              display: none;
            }

            .nav-label-mobile {
              display: inline;
            }

            .battle-plan-filter {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 6px;
              width: 100%;
            }

            .battle-filter-button {
              min-width: 0;
              width: 100%;
              padding-inline: 8px;
              white-space: normal;
              line-height: 1.15;
            }

            .battle-card-kicker {
              margin-bottom: 5px;
            }

            .battle-system-badge,
            .max-capability-badge {
              font-size: 0.67rem;
            }
          }
          '''
          p.write_text(css)

          # Cache-bust every supporting page that references the shared CSS.
          for filename in [
              'public/manage.html',
              'public/index.html',
              'public/sources.html',
              'public/admin.html'
          ]:
              p = Path(filename)
              page = p.read_text()
              if '/styles.css?v=30' not in page:
                  raise SystemExit(f'missing v30 stylesheet anchor in {filename}')
              p.write_text(page.replace('/styles.css?v=30', '/styles.css?v=31'))
          PY

      - name: Validate
        shell: bash
        run: |
          node --check src/index.js
          node --check src/battle-opportunities.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/manage.html').read_text()
          blocks = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(blocks) != 1:
              raise SystemExit(f'expected one inline script, found {len(blocks)}')
          Path('/tmp/manage-inline.js').write_text(blocks[0])
          PY
          node --check /tmp/manage-inline.js
          npm test
          git diff --check

      - name: Commit integration and remove one-off workflow
        shell: bash
        run: |
          git config user.name "Jquak10"
          git config user.email "103067474+Jquak10@users.noreply.github.com"
          rm .github/workflows/part2-ui-patch.yml
          git add src/index.js public/manage.html public/styles.css public/index.html public/sources.html public/admin.html .github/workflows/part2-ui-patch.yml
          git diff --cached --check
          git commit -m "feat: integrate Max Battles into Battle Plan UI"
          git push origin HEAD:feat/max-battle-plan-ui
