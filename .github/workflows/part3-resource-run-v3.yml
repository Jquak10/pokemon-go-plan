name: Part 3 resource integration v3

on:
  push:
    branches:
      - feat/max-battle-resources

permissions:
  contents: write

jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[part3-run-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/max-battle-resources
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reuse guarded patch with corrected anchor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/part3-resource-patch.yml').read_text()
          match = re.search(
              r"python3 <<'PY'\n(?P<body>[\s\S]*?)\n\s+PY\n\n\s+node --check src/index\.js",
              workflow
          )
          if not match:
              raise SystemExit('Could not extract original guarded patch script')

          script = textwrap.dedent(match.group('body'))
          label = '    "particle cost inference"\n)'
          label_index = script.find(label)
          if label_index < 0:
              raise SystemExit('Could not locate particle cost inference block')
          block_start = script.rfind('replace_once(', 0, label_index)
          if block_start < 0:
              raise SystemExit('Could not locate start of particle cost inference block')
          block_end = label_index + len(label)

          replacement = '''replace_once(
              index,
              "      const key = [\\n",
              """      const maxParticleCost =
                inferMaxParticleCost({
                  ...battleMetadata,
                  pokemon_name:
                    match.name,
                  event_title:
                    event.summary,
                  event_description:
                    event.description || \"\"
                });

              const key = [
          """,
              "particle cost inference"
          )'''

          script = script[:block_start] + replacement + script[block_end:]
          exec(compile(script, 'part3-integrate.py', 'exec'), {})
          PY

          node --check src/index.js
          npm test

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public tests package.json schema.sql migrations src/resource-planning.js
          git commit -m "feat: integrate shared battle resource planning"
          git push origin HEAD:feat/max-battle-resources
