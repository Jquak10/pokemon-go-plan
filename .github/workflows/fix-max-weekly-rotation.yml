name: Fix weekly Max rotation source

on:
  push:
    branches:
      - fix/max-weekly-rotation-source

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/max-weekly-rotation-source
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded fix
        run: node scripts/fix-max-weekly-rotation.mjs

      - name: Check JavaScript syntax
        run: |
          node --check src/battle-opportunities.js
          node --check src/index.js
          node --check tests/battle-opportunities.test.mjs

      - name: Run deterministic tests
        run: npm test

      - name: Check diff
        run: git diff --check

      - name: Commit validated fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/battle-opportunities.js src/index.js tests/battle-opportunities.test.mjs
          git commit -m "fix: derive weekly Max Battle rotations"
          git push origin HEAD:fix/max-weekly-rotation-source
