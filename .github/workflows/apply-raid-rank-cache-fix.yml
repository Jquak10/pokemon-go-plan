name: Apply raid rank cache fix

on:
  push:
    branches:
      - fix/raid-rank-cache-version

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-rank-cache-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache-version patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/index.js")
          text = path.read_text()

          if "export function raidRankProfileJsonIsCurrent" not in text:
              def sub_once(source, pattern, replacement, label, flags=0):
                  updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
                  assert count == 1, f"{label} anchor changed"
                  return updated

              text = sub_once(
                  text,
                  r'''function raidRankingsJsonForPokemonName\(\n\s*name,\n\s*metas\n\) \{\n\s*const normalized =\n\s*normalizeName\(name\);\n''',
                  '''export function raidRankProfileJsonIsCurrent(value) {
            if (!value) return false;

            try {
              const profile =
                typeof value === "string"
                  ? JSON.parse(value)
                  : value;

              return (
                profile &&
                typeof profile === "object" &&
                profile.method ===
                  RAID_RANK_METHOD_VERSION
              );
            } catch {
              return false;
            }
          }

          function currentRaidRankingsJson(value) {
            return raidRankProfileJsonIsCurrent(value)
              ? value
              : null;
          }

          function raidRankingsJsonForPokemonName(
            name,
            metas
          ) {
            const normalized =
              normalizeName(name);
          ''',
                  "raidRankingsJsonForPokemonName"
              )

              text = sub_once(
                  text,
                  r'''\n\s*if \(exact\?\.raid_rankings_json\) \{\n\s*return exact\.raid_rankings_json;\n\s*\}\n''',
                  '''

            const exactRankingsJson =
              currentRaidRankingsJson(
                exact?.raid_rankings_json
              );

            if (exactRankingsJson) {
              return exactRankingsJson;
            }
          ''',
                  "exact ranking return"
              )

              text = sub_once(
                  text,
                  r'''\n\s*return fallback\?\.raid_rankings_json \|\| null;\n\}''',
                  '''

            return currentRaidRankingsJson(
              fallback?.raid_rankings_json
            );
          }''',
                  "fallback ranking return"
              )

              get_meta_start = text.index("async function getMeta(env) {")
              get_meta_end = text.index("\nfunction findMatches", get_meta_start)
              get_meta = text[get_meta_start:get_meta_end]
              assert "  return results;" in get_meta, "getMeta return anchor changed"
              get_meta = get_meta.replace(
                  "  return results;",
                  '''  return (results || []).map(row => ({
            ...row,
            raid_rankings_json:
              currentRaidRankingsJson(
                row.raid_rankings_json
              )
          }));''',
                  1
              )
              text = text[:get_meta_start] + get_meta + text[get_meta_end:]

              sync_start = text.index("async function syncAutomaticMeta(env) {")
              sync_end = text.index("\nasync function userByManageToken", sync_start)
              sync = text[sync_start:sync_end]

              sync = sub_once(
                  sync,
                  r'''\) AS raid_rank_updated_at\n\s*FROM pokemon_meta pm\n\s*`\)\.bind\(\n\s*RAID_RANK_SOURCE_NAME\n\s*\)\.all\(\);''',
                  ''') AS raid_rank_updated_at,
              (
                SELECT ms.note
                FROM meta_sources ms
                WHERE ms.pokemon_name = pm.pokemon_name
                  AND ms.source_name = ?
                ORDER BY ms.updated_at DESC
                LIMIT 1
              ) AS raid_rankings_json
            FROM pokemon_meta pm
          `).bind(
            RAID_RANK_SOURCE_NAME,
            RAID_RANK_SOURCE_NAME
          ).all();''',
                  "existing meta query"
              )

              sync = sub_once(
                  sync,
                  r'''const raidRankRefresh =\n\s*!existing\?\.raid_rank_updated_at \|\|\n\s*existing\.raid_rank_updated_at <\n\s*raidRankStaleBefore;''',
                  '''const raidRankRefresh =
                  !existing?.raid_rank_updated_at ||
                  existing.raid_rank_updated_at <
                    raidRankStaleBefore ||
                  (
                    Boolean(
                      existing?.raid_rankings_json
                    ) &&
                    !raidRankProfileJsonIsCurrent(
                      existing.raid_rankings_json
                    )
                  );''',
                  "raidRankRefresh"
              )

              sync = sub_once(
                  sync,
                  r'''const raidRankBackfillRows =\n\s*\(existingMetaRows \|\| \[\]\)\n\s*\.filter\(row =>[\s\S]*?MAX_RAID_RANK_BACKFILLS_PER_SYNC\n\s*\);''',
                  '''const raidRankBackfillRows =
            (existingMetaRows || [])
              .filter(row =>
                !selectedKeys.has(
                  normalizeName(
                    row.pokemon_name
                  )
                ) &&
                (
                  !row.raid_rank_updated_at ||
                  row.raid_rank_updated_at <
                    raidRankStaleBefore ||
                  (
                    Boolean(
                      row.raid_rankings_json
                    ) &&
                    !raidRankProfileJsonIsCurrent(
                      row.raid_rankings_json
                    )
                  )
                )
              )
              .sort(
                (a, b) =>
                  Number(
                    Boolean(b.raid_rankings_json) &&
                    !raidRankProfileJsonIsCurrent(
                      b.raid_rankings_json
                    )
                  ) -
                    Number(
                      Boolean(a.raid_rankings_json) &&
                      !raidRankProfileJsonIsCurrent(
                        a.raid_rankings_json
                      )
                    ) ||
                  String(
                    a.raid_rank_updated_at || ""
                  ).localeCompare(
                    String(
                      b.raid_rank_updated_at || ""
                    )
                  )
              )
              .slice(
                0,
                MAX_RAID_RANK_BACKFILLS_PER_SYNC
              );''',
                  "raidRankBackfillRows"
              )

              text = text[:sync_start] + sync + text[sync_end:]
              path.write_text(text)
      - name: Validate
        run: |
          node --check src/index.js
          npm test
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: invalidate stale raid rank profiles"
          git push origin HEAD:fix/raid-rank-cache-version
