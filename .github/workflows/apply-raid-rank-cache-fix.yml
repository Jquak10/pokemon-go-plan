name: Apply raid rank cache fix

on:
  push:
    branches:
      - fix/raid-rank-cache-version

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-rank-cache-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache-version patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/index.js")
          text = path.read_text()

          if "export function raidRankProfileJsonIsCurrent" not in text:
              def sub_once(pattern, replacement, label, flags=0):
                  global text
                  text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
                  assert count == 1, f"{label} anchor changed"

              sub_once(
                  r'''function raidRankingsJsonForPokemonName\(\n\s*name,\n\s*metas\n\) \{\n\s*const normalized =\n\s*normalizeName\(name\);\n''',
                  '''export function raidRankProfileJsonIsCurrent(value) {
            if (!value) return false;

            try {
              const profile =
                typeof value === "string"
                  ? JSON.parse(value)
                  : value;

              return (
                profile &&
                typeof profile === "object" &&
                profile.method ===
                  RAID_RANK_METHOD_VERSION
              );
            } catch {
              return false;
            }
          }

          function currentRaidRankingsJson(value) {
            return raidRankProfileJsonIsCurrent(value)
              ? value
              : null;
          }

          function raidRankingsJsonForPokemonName(
            name,
            metas
          ) {
            const normalized =
              normalizeName(name);
          ''',
                  "raidRankingsJsonForPokemonName"
              )

              sub_once(
                  r'''\s*if \(exact\?\.raid_rankings_json\) \{\n\s*return exact\.raid_rankings_json;\n\s*\}\n''',
                  '''

            const exactRankingsJson =
              currentRaidRankingsJson(
                exact?.raid_rankings_json
              );

            if (exactRankingsJson) {
              return exactRankingsJson;
            }
          ''',
                  "exact ranking return"
              )

              sub_once(
                  r'''\s*return fallback\?\.raid_rankings_json \|\| null;\n\}''',
                  '''

            return currentRaidRankingsJson(
              fallback?.raid_rankings_json
            );
          }''',
                  "fallback ranking return"
              )

              get_meta_start = text.index("async function getMeta(env) {")
              get_meta_end = text.index("\nfunction findMatches", get_meta_start)
              get_meta = text[get_meta_start:get_meta_end]
              assert "  return results;" in get_meta, "getMeta return anchor changed"
              get_meta = get_meta.replace(
                  "  return results;",
                  '''  return (results || []).map(row => ({
            ...row,
            raid_rankings_json:
              currentRaidRankingsJson(
                row.raid_rankings_json
              )
          }));''',
                  1
              )
              text = text[:get_meta_start] + get_meta + text[get_meta_end:]

              sync_start = text.index("async function syncAutomaticMeta(env) {")
              sync_end = text.index("\nasync function userByManageToken", sync_start)
              sync = text[sync_start:sync_end]

              old = '''        ) AS raid_rank_updated_at
              FROM pokemon_meta pm
            `).bind(
              RAID_RANK_SOURCE_NAME
            ).all();'''
              new = '''        ) AS raid_rank_updated_at,
              (
                SELECT ms.note
                FROM meta_sources ms
                WHERE ms.pokemon_name = pm.pokemon_name
                  AND ms.source_name = ?
                ORDER BY ms.updated_at DESC
                LIMIT 1
              ) AS raid_rankings_json
              FROM pokemon_meta pm
            `).bind(
              RAID_RANK_SOURCE_NAME,
              RAID_RANK_SOURCE_NAME
            ).all();'''
              assert old in sync, "existing meta query anchor changed"
              sync = sync.replace(old, new, 1)

              old = '''        const raidRankRefresh =
                  !existing?.raid_rank_updated_at ||
                  existing.raid_rank_updated_at <
                    raidRankStaleBefore;

                const priorityBucket =
                  missingRecord
                    ? 0
                    : spriteCorrection
                      ? 1
                      : spriteBackfill
                        ? 2
                        : activeToday
                          ? 3
                          : raidRankRefresh
                            ? 4
                            : 5;'''
              new = '''        const raidRankMethodStale =
                  Boolean(
                    existing?.raid_rankings_json
                  ) &&
                  !raidRankProfileJsonIsCurrent(
                    existing.raid_rankings_json
                  );

                const raidRankRefresh =
                  raidRankMethodStale ||
                  !existing?.raid_rank_updated_at ||
                  existing.raid_rank_updated_at <
                    raidRankStaleBefore;

                const priorityBucket =
                  missingRecord
                    ? 0
                    : spriteCorrection
                      ? 1
                      : spriteBackfill
                        ? 2
                        : activeToday
                          ? 3
                          : raidRankMethodStale
                            ? 4
                            : raidRankRefresh
                              ? 5
                              : 6;'''
              assert old in sync, "raidRankRefresh anchor changed"
              sync = sync.replace(old, new, 1)

              old = '''          spriteCorrection,
                  raidRankRefresh,
                  activeToday,'''
              new = '''          spriteCorrection,
                  raidRankMethodStale,
                  raidRankRefresh,
                  activeToday,'''
              assert old in sync, "ranked candidate fields anchor changed"
              sync = sync.replace(old, new, 1)

              old = '''  const raidRankBackfillRows =
            (existingMetaRows || [])
              .filter(row =>
                !selectedKeys.has(
                  normalizeName(
                    row.pokemon_name
                  )
                ) &&
                (
                  !row.raid_rank_updated_at ||
                  row.raid_rank_updated_at <
                    raidRankStaleBefore
                )
              )
              .slice(
                0,
                MAX_RAID_RANK_BACKFILLS_PER_SYNC
              );'''
              new = '''  const raidRankBackfillRows =
            (existingMetaRows || [])
              .map(row => ({
                row,
                method_stale:
                  Boolean(
                    row.raid_rankings_json
                  ) &&
                  !raidRankProfileJsonIsCurrent(
                    row.raid_rankings_json
                  )
              }))
              .filter(item =>
                !selectedKeys.has(
                  normalizeName(
                    item.row.pokemon_name
                  )
                ) &&
                (
                  item.method_stale ||
                  !item.row.raid_rank_updated_at ||
                  item.row.raid_rank_updated_at <
                    raidRankStaleBefore
                )
              )
              .sort(
                (a, b) =>
                  Number(b.method_stale) -
                    Number(a.method_stale) ||
                  String(
                    a.row.raid_rank_updated_at || ""
                  ).localeCompare(
                    String(
                      b.row.raid_rank_updated_at || ""
                    )
                  ) ||
                  String(
                    a.row.pokemon_name || ""
                  ).localeCompare(
                    String(
                      b.row.pokemon_name || ""
                    )
                  )
              )
              .slice(
                0,
                MAX_RAID_RANK_BACKFILLS_PER_SYNC
              )
              .map(item => item.row);'''
              assert old in sync, "raidRankBackfillRows anchor changed"
              sync = sync.replace(old, new, 1)

              text = text[:sync_start] + sync + text[sync_end:]
              path.write_text(text)
      - name: Validate
        run: |
          node --check src/index.js
          npm test
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git commit -m "fix: invalidate stale raid rank profiles"
          git push origin HEAD:fix/raid-rank-cache-version
