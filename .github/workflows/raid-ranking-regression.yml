name: Planner regression

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          find src public tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
      - run: npm test
      - name: Validate Worker package
        run: npm run check:worker
      - run: git diff --check

  browser-ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium webkit
      - name: Run responsive Chromium regressions
        run: python tests/browser_ui_test.py
      - name: Run focused WebKit smoke
        run: python tests/webkit_smoke_test.py

  live-contract:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:live
