name: Fix Max Battle plan regressions

on:
  push:
    branches:
      - fix/max-battle-cards-and-plan-ui

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/max-battle-cards-and-plan-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize helper quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/fix-max-battle-plan.mjs')
          text = path.read_text()
          old = "assert.equal(T.canonicalName(match.name,T.kind(metadata)),`Dynamax ${match.name}`);"
          new = "assert.equal(T.canonicalName(match.name,T.kind(metadata)),'Dynamax '+match.name);"
          if old not in text:
              raise SystemExit('Expected nested template assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply guarded fix
        run: node scripts/fix-max-battle-plan.mjs

      - name: Check JavaScript syntax
        run: |
          node --check src/battle-opportunities.js
          node --check src/index.js

      - name: Run deterministic tests
        run: npm test

      - name: Check diff
        run: git diff --check

      - name: Commit validated fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/styles.css public/manage.html public/index.html public/admin.html public/sources.html tests/battle-opportunities.test.mjs tests/battle-plan-ui.test.mjs tests/battle-targets.test.mjs
          git commit -m "fix: restore Max Battle cards and compact plan UI"
          git push origin HEAD:fix/max-battle-cards-and-plan-ui
