name: Apply raid rank hardening

on:
  push:
    branches:
      - fix/raid-rank-regressions-and-card-ux
    paths:
      - .github/workflows/apply-raid-rank-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-rank-regressions-and-card-ux
          fetch-depth: 0

      - name: Apply changes
        run: |
          python .github/scripts/apply_raid_rank_hardening.py
          rm -f .github/workflows/raid-ranking-regression.yml

      - name: Validate
        run: |
          node --check src/index.js
          node --check src/raid-rankings.js
          npm test
          npm run test:live
          python - <<'PY'
          from pathlib import Path
          import re, tempfile, subprocess
          s = Path('public/manage.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', s)
          if not m:
              raise SystemExit('inline manage script not found')
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(m.group(1))
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          assert '/styles.css?v=30' in s
          assert 'raid-rank-details' in s
          assert 'shadow-sprite' in s
          PY
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/manage.html public/styles.css package.json tests
          git commit -m "fix: harden raid ranks and simplify cards"
          git push origin HEAD:fix/raid-rank-regressions-and-card-ux
