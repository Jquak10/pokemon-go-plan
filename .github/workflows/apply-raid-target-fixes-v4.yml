name: Apply raid and target fixes v4

on:
  push:
    branches:
      - fix/raid-plan-targets-correctness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-plan-targets-correctness
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def require_once(text, needle, label):
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")

          # ---------------- Backend ----------------
          p = Path('src/index.js')
          s = p.read_text(encoding='utf-8')

          date_fn = '''function dateFromPropertyLine(line) {
            if (!line) return null;
            const colon = line.indexOf(":");
            if (colon < 0) return null;
            const raw = line.slice(colon + 1);
            const match = raw.match(/^(\\d{4})(\\d{2})(\\d{2})/);
            if (!match) return null;
            return `${match[1]}-${match[2]}-${match[3]}`;
          }'''
          # Match source indentation exactly by locating function boundaries instead of regex.
          start = s.find('function dateFromPropertyLine(line) {')
          end = s.find('\n}\n\nfunction parseIcsEvents', start)
          if start < 0 or end < 0:
              raise SystemExit('date helper: function boundary not found')
          original = s[start:end+2]
          replacement = original + '''

function inclusiveEndDateFromPropertyLine(line, fallbackStartDate = null) {
  const endDate = dateFromPropertyLine(line);
  if (!endDate) return fallbackStartDate;

  const colon = line.indexOf(":");
  const left = colon >= 0 ? line.slice(0, colon).toUpperCase() : "";
  const raw = colon >= 0 ? line.slice(colon + 1).trim() : "";
  const isAllDay = left.includes("VALUE=DATE") || /^\\d{8}$/.test(raw);
  if (!isAllDay) return endDate;

  // RFC 5545 all-day DTEND is exclusive, so convert it to an inclusive day.
  const adjusted = addDaysIso(endDate, -1);
  if (!adjusted) return fallbackStartDate || endDate;
  if (fallbackStartDate && adjusted < fallbackStartDate) return fallbackStartDate;
  return adjusted;
}'''
          s = s[:start] + replacement + s[end+2:]

          old_end = '      end_date: dateFromPropertyLine(dtendProp?.line || dtstartProp.line),'
          require_once(s, old_end, 'parse end_date')
          s = s.replace(old_end, '''      end_date: dtendProp
        ? inclusiveEndDateFromPropertyLine(
            dtendProp.line,
            dateFromPropertyLine(dtstartProp.line)
          )
        : dateFromPropertyLine(dtstartProp.line),''', 1)

          loop_marker = '''  for (const event of events) {
    if (
      eventIsSuppressedByRules('''
          require_once(s, loop_marker, 'recommendation loop')
          s = s.replace(loop_marker, '''  for (const event of events) {
    const effectiveEndDate = event.dtend_line
      ? inclusiveEndDateFromPropertyLine(event.dtend_line, event.start_date)
      : (event.end_date || event.start_date);

    // Existing rows can still contain an RFC 5545 exclusive all-day DTEND.
    // Gate using the raw ICS property so an expired boss cannot leak into today.
    if (effectiveEndDate && effectiveEndDate < day) {
      continue;
    }

    if (
      eventIsSuppressedByRules(''', 1)

          delete_start = s.find('async function deleteTarget(request, env) {')
          if delete_start < 0:
              raise SystemExit('deleteTarget function not found')
          next_fn = s.find('\nasync function ', delete_start + 10)
          if next_fn < 0:
              raise SystemExit('deleteTarget end boundary not found')
          delete_block = s[delete_start:next_fn]
          bulk_fn = '''
async function bulkDeleteTargets(request, env) {
  let body;
  try {
    body = await request.json();
  } catch {
    return bad("Invalid JSON body.");
  }

  const user = await userByManageToken(env, body?.token);
  if (!user) return bad("Invalid management link.", 401);

  const ids = [...new Set(
    (Array.isArray(body?.target_ids) ? body.target_ids : [])
      .map((id) => String(id || "").trim())
      .filter(Boolean)
  )];

  if (!ids.length) return bad("Select at least one target.");
  if (ids.length > 200) return bad("Too many targets selected.");

  const results = await env.DB.batch(
    ids.map((id) => env.DB.prepare(`
      DELETE FROM targets
      WHERE id = ? AND user_id = ?
    `).bind(id, user.id))
  );

  const deleted = results.reduce(
    (sum, result) => sum + Number(result?.meta?.changes || 0),
    0
  );

  return json({ ok: true, deleted });
}
'''
          s = s[:next_fn] + bulk_fn + s[next_fn:]

          route_marker = '''    if (request.method === "DELETE" && path === "/api/targets") {
      return deleteTarget(request, env);
    }'''
          require_once(s, route_marker, 'target delete route')
          s = s.replace(route_marker, '''    if (request.method === "POST" && path === "/api/targets/bulk-delete") {
      return bulkDeleteTargets(request, env);
    }

''' + route_marker, 1)

          p.write_text(s, encoding='utf-8')

          # ---------------- Frontend ----------------
          p = Path('public/manage.html')
          s = p.read_text(encoding='utf-8')

          add_target_button = '<button id="openAddTarget" type="button" class="button add-target-button">'
          require_once(s, add_target_button, 'add target button')
          s = s.replace(add_target_button, '''<button id="toggleTargetSelection" type="button" class="secondary" aria-pressed="false">Select</button>

              ''' + add_target_button, 1)

          summary_marker = '<div id="targetFilterSummary" class="target-filter-summary"></div>'
          require_once(s, summary_marker, 'target filter summary')
          s = s.replace(summary_marker, summary_marker + '''

          <div id="bulkTargetActions" class="target-heading-actions hidden" aria-live="polite">
            <button id="selectAllVisibleTargets" type="button" class="secondary">Select all shown</button>
            <button id="deleteSelectedTargets" type="button" class="ghost-danger" disabled>Delete selected</button>
            <button id="cancelTargetSelection" type="button" class="secondary">Cancel</button>
          </div>''', 1)

          state_marker = 'let targetById = new Map();'
          require_once(s, state_marker, 'target state marker')
          s = s.replace(state_marker, state_marker + '''
let targetSelectionMode = false;
const selectedTargetIds = new Set();''', 1)

          unlock_marker = '''  document.body.style.width = "";

  window.scrollTo('''
          require_once(s, unlock_marker, 'modal unlock marker')
          s = s.replace(unlock_marker, '''  document.body.style.width = "";

  document.removeEventListener("touchstart", modalTouchStartGuard);
  document.removeEventListener("touchmove", modalTouchMoveGuard);
  setForegroundSheetOpen(false);

  window.scrollTo(''', 1)

          badge_marker = '  document.getElementById("targetTabCount").textContent = state.targets.length;'
          require_once(s, badge_marker, 'target nav badge')
          s = s.replace(badge_marker, '  document.getElementById("targetTabCount").textContent = activeTargets;', 1)

          render_marker = 'function renderTargets() {'
          require_once(s, render_marker, 'renderTargets marker')
          helpers = '''function visibleTargetIdsForSelection() {
  return filteredTargets().map((target) => String(target.id));
}

function syncTargetSelectionUi(list = filteredTargets()) {
  const validIds = new Set((state?.targets || []).map((target) => String(target.id)));
  for (const id of [...selectedTargetIds]) {
    if (!validIds.has(id)) selectedTargetIds.delete(id);
  }

  const visibleIds = list.map((target) => String(target.id));
  const allVisibleSelected = visibleIds.length > 0 && visibleIds.every((id) => selectedTargetIds.has(id));
  const toggle = document.getElementById("toggleTargetSelection");
  const actions = document.getElementById("bulkTargetActions");
  const deleteButton = document.getElementById("deleteSelectedTargets");
  const selectAllButton = document.getElementById("selectAllVisibleTargets");

  if (toggle) {
    toggle.textContent = targetSelectionMode ? "Done" : "Select";
    toggle.setAttribute("aria-pressed", targetSelectionMode ? "true" : "false");
  }
  actions?.classList.toggle("hidden", !targetSelectionMode);

  if (deleteButton) {
    deleteButton.disabled = selectedTargetIds.size === 0;
    deleteButton.textContent = selectedTargetIds.size
      ? `Delete ${selectedTargetIds.size} selected`
      : "Delete selected";
  }

  if (selectAllButton) {
    selectAllButton.disabled = visibleIds.length === 0;
    selectAllButton.textContent = allVisibleSelected
      ? `Clear shown (${visibleIds.length})`
      : `Select all shown (${visibleIds.length})`;
  }

  document.querySelectorAll("#targets [data-edit-target]").forEach((editButton) => {
    const id = String(editButton.dataset.editTarget || "");
    const actionsEl = editButton.closest(".target-actions");
    if (!id || !actionsEl || actionsEl.querySelector(`[data-select-target="${CSS.escape(id)}"]`)) return;

    if (!targetSelectionMode) return;

    const button = document.createElement("button");
    button.type = "button";
    button.className = `${selectedTargetIds.has(id) ? "button" : "secondary"} small-button`;
    button.dataset.selectTarget = id;
    button.setAttribute("aria-pressed", selectedTargetIds.has(id) ? "true" : "false");
    button.textContent = selectedTargetIds.has(id) ? "Selected ✓" : "Select";
    actionsEl.prepend(button);
  });
}

function toggleTargetSelectionMode() {
  targetSelectionMode = !targetSelectionMode;
  if (!targetSelectionMode) selectedTargetIds.clear();
  renderTargets();
}

function toggleTargetSelected(id) {
  const key = String(id);
  if (selectedTargetIds.has(key)) selectedTargetIds.delete(key);
  else selectedTargetIds.add(key);
  renderTargets();
}

function toggleAllVisibleTargets() {
  const ids = visibleTargetIdsForSelection();
  const allSelected = ids.length > 0 && ids.every((id) => selectedTargetIds.has(id));
  ids.forEach((id) => {
    if (allSelected) selectedTargetIds.delete(id);
    else selectedTargetIds.add(id);
  });
  renderTargets();
}

async function bulkDeleteSelectedTargets() {
  const ids = [...selectedTargetIds];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} selected target${ids.length === 1 ? "" : "s"}?`)) return;

  const button = document.getElementById("deleteSelectedTargets");
  if (button) {
    button.disabled = true;
    button.textContent = "Deleting…";
  }

  try {
    await api("/api/targets/bulk-delete", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, target_ids: ids })
    });
    selectedTargetIds.clear();
    targetSelectionMode = false;
    await load();
    activateTab("targets", false);
  } catch (error) {
    alert(error.message);
    syncTargetSelectionUi();
  }
}

'''
          s = s.replace(render_marker, helpers + render_marker, 1)

          final_render = '  container.innerHTML =\n    sections.join("");\n}'
          require_once(s, final_render, 'targets render final assignment')
          s = s.replace(final_render, '  container.innerHTML =\n    sections.join("");\n\n  syncTargetSelectionUi(list);\n}', 1)

          # Keep toolbar state correct even for empty/filter-empty returns.
          list_marker = '''  const list =
    filteredTargets(
      matchingTargets
    );'''
          require_once(s, list_marker, 'filtered target list')
          s = s.replace(list_marker, list_marker + '\n\n  syncTargetSelectionUi(list);', 1)

          open_listener = 'document.getElementById("openAddTarget").addEventListener("click", () => openTargetModal());'
          require_once(s, open_listener, 'open target listener')
          s = s.replace(open_listener, open_listener + '''
document.getElementById("toggleTargetSelection").addEventListener("click", toggleTargetSelectionMode);
document.getElementById("cancelTargetSelection").addEventListener("click", () => {
  targetSelectionMode = false;
  selectedTargetIds.clear();
  renderTargets();
});
document.getElementById("selectAllVisibleTargets").addEventListener("click", toggleAllVisibleTargets);
document.getElementById("deleteSelectedTargets").addEventListener("click", bulkDeleteSelectedTargets);''', 1)

          target_click = '''document.getElementById("targets").addEventListener("click", event => {
  const edit = event.target.closest("[data-edit-target]");'''
          require_once(s, target_click, 'target click handler')
          s = s.replace(target_click, '''document.getElementById("targets").addEventListener("click", event => {
  const select = event.target.closest("[data-select-target]");
  if (select) {
    toggleTargetSelected(select.dataset.selectTarget);
    return;
  }

  const edit = event.target.closest("[data-edit-target]");''', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          node --check src/index.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('public/manage.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/manage-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/manage-inline.js
          grep -q 'targetTabCount").textContent = activeTargets' public/manage.html
          grep -q 'setForegroundSheetOpen(false)' public/manage.html
          grep -q '/api/targets/bulk-delete' src/index.js
          grep -q 'inclusiveEndDateFromPropertyLine' src/index.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-raid-target-fixes.yml .github/workflows/apply-raid-target-fixes-v2.yml .github/workflows/apply-raid-target-fixes-v3.yml .github/workflows/apply-raid-target-fixes-v4.yml || true
          git add public/manage.html src/index.js
          git diff --cached --check
          git commit -m "fix: raid plan and target correctness"
          git push origin HEAD:fix/raid-plan-targets-correctness
